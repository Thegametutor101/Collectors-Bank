  web:
    generate: true
    image_path: "assets/images/collectors_bank_logo.png"
    backgroundColor: "#272727"
    theme_color: "#3C7189"
  windows:
    generate: true
    image_path: "assets/images/collectors_bank_logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/collectors_bank_logo.png"